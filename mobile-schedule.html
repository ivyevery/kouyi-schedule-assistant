<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f2">
  <title>口译日程 · 手机版</title>
  <link rel="manifest" href="app.webmanifest">
  <link rel="icon" href="assets/pwa/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/pwa/icon-192.png">
  <script src="pwa-register.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f2;
      --surface: #fbfcf9;
      --surface-strong: #ffffff;
      --ink: #19211c;
      --muted: #68736b;
      --line: #dbe1da;
      --accent: #246347;
      --accent-soft: #e3eee7;
      --reserved: #a86022;
      --confirmed: #2f6c50;
      --completed: #748078;
      --cancelled: #9b9f9b;
      --danger: #9b3d35;
      --radius: 16px;
      --shadow: 0 16px 40px rgba(35, 58, 44, .10);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #111713;
        --surface: #18201b;
        --surface-strong: #202a23;
        --ink: #eef3ef;
        --muted: #a9b5ac;
        --line: #344039;
        --accent: #78b994;
        --accent-soft: #233b2e;
        --reserved: #e2a46c;
        --confirmed: #78b994;
        --completed: #a2ada5;
        --cancelled: #858d87;
        --danger: #e0958e;
        --shadow: 0 16px 40px rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .hidden { display: none !important; }

    .app {
      width: min(100%, 560px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom));
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { min-width: 0; }
    .brand h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
    .save-state {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .today-btn, .month-button, .text-button, .icon-button, .primary-button, .secondary-button {
      border: 0;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }
    button:active { transform: scale(.97); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 36%, transparent);
      outline-offset: 2px;
    }
    .today-btn {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 15px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .view { display: grid; gap: 18px; }
    .week-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 1px 4px;
      scroll-snap-type: x proximity;
      overscroll-behavior-inline: contain;
      scrollbar-width: none;
    }
    .week-strip::-webkit-scrollbar { display: none; }
    .week-wheel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .week-wheel-title { color: var(--muted); font-size: 12px; }
    .week-wheel-actions { display: flex; gap: 4px; }
    .week-shift {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
    }
    .week-day {
      flex: 0 0 calc((100% - 36px) / 7);
      min-width: 46px;
      min-height: 72px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      cursor: pointer;
      scroll-snap-align: start;
    }
    .week-day.today { border-color: var(--accent); background: var(--accent-soft); }
    .week-day.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .week-name { color: var(--muted); font-size: 11px; }
    .week-number { font-size: 18px; font-weight: 760; line-height: 1; }
    .dot-row { min-height: 6px; display: flex; justify-content: center; gap: 3px; }
    .event-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .event-dot.confirmed { background: var(--reserved); }
    .event-dot.completed { background: var(--completed); }

    .selected-day-panel {
      display: grid;
      gap: 9px;
      border-radius: var(--radius);
      background: var(--accent-soft);
      padding: 12px;
    }
    .selected-day-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .selected-day-head h2 { margin: 0; font-size: 15px; }
    .selected-day-head span { color: var(--muted); font-size: 11px; }
    .selected-day-list { display: grid; gap: 8px; }
    .selected-day-list .meeting { background: var(--surface-strong); }

    .section-label { margin: 0; font-size: 16px; }
    .upcoming-list { display: grid; gap: 9px; }
    .paper-note {
      position: relative;
      min-height: 72px;
      display: grid;
      grid-template-columns: 50px 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 11px 13px;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
    }
    .paper-note::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--confirmed);
    }
    .paper-note.status-reserved::before { background: var(--reserved); }
    .paper-note.status-completed::before { background: var(--completed); }
    .paper-note.empty-note { cursor: default; opacity: .54; }
    .paper-note.empty-note::before { background: var(--line); }
    .note-date { color: var(--accent); font-size: 12px; font-weight: 760; text-align: center; line-height: 1.25; }
    .note-date strong { display: block; color: var(--ink); font-size: 21px; }
    .note-main { min-width: 0; }
    .note-title { display: block; font-size: 14px; font-weight: 760; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .note-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .note-status { color: var(--muted); font-size: 11px; }
    .calendar-section { background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
    .calendar-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-bottom: 10px; }
    .month-button {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: transparent;
      font-size: 25px;
      line-height: 1;
    }
    .month-button:hover { background: var(--accent-soft); }
    .month-title { text-align: center; font-size: 16px; font-weight: 750; }
    .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .weekday { padding: 3px 0 7px; text-align: center; color: var(--muted); font-size: 11px; }
    .day {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      min-width: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
    }
    .day-number { font-size: 13px; line-height: 1; }
    .day.outside { color: color-mix(in srgb, var(--muted) 48%, transparent); }
    .day-dots { position: absolute; bottom: 4px; display: flex; gap: 2px; }
    .day-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
    .day-dot.confirmed { background: var(--reserved); }
    .day-dot.completed { background: var(--completed); }
    .day.today { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); font-weight: 800; }
    .day.selected { background: var(--accent); color: #f7fbf8; }
    .day.selected .day-dot { box-shadow: 0 0 0 1px color-mix(in srgb, #f7fbf8 88%, transparent); }

    .agenda-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
    .agenda-date { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .agenda-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .agenda-list { display: grid; gap: 10px; }
    .meeting {
      border: 1px solid var(--line);
      border-left: 4px solid var(--confirmed);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 12px 13px;
      text-align: left;
      cursor: pointer;
    }
    .meeting.status-reserved { border-left-color: var(--reserved); }
    .meeting.status-completed { border-left-color: var(--completed); opacity: .78; }
    .meeting.status-cancelled { border-left-color: var(--cancelled); opacity: .58; }
    .meeting-top { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .meeting-title { font-size: 14px; font-weight: 760; line-height: 1.35; overflow-wrap: anywhere; }
    .status-text { color: var(--accent); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .status-reserved .status-text { color: var(--reserved); }
    .status-completed .status-text { color: var(--completed); }
    .status-cancelled .status-text { color: var(--cancelled); }
    .meeting-meta { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .empty {
      min-height: 138px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 8px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      padding: 24px;
    }
    .empty strong { color: var(--ink); font-size: 15px; }

    .list-tools { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .list-tools::-webkit-scrollbar { display: none; }
    .filter-button {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      white-space: nowrap;
    }
    .filter-button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }

    .data-panel { display: grid; gap: 14px; }
    .data-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px; }
    .data-card h2 { margin: 0 0 7px; font-size: 17px; }
    .data-card p { margin: 0 0 15px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .button-row { display: flex; flex-wrap: wrap; gap: 9px; }
    .cloud-login-fields { display: grid; gap: 10px; }
    .cloud-login-fields label { display: grid; gap: 6px; color: var(--ink); }
    .cloud-login-fields input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface-strong);
      color: var(--ink);
      padding: 0 13px;
    }
    .primary-button, .secondary-button {
      min-height: 44px;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 750;
    }
    .primary-button { background: var(--accent); color: #f7fbf8; }
    .secondary-button { border: 1px solid var(--line); background: var(--surface-strong); }
    .danger-button { color: var(--danger); }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(calc(100% - 24px), 536px);
      height: 64px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
      border-radius: 18px;
      background: color-mix(in srgb, var(--surface-strong) 92%, transparent);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
    }
    .nav-button, .nav-add {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      min-width: 0;
    }
    .nav-button.active { color: var(--accent); background: var(--accent-soft); }
    .nav-add {
      width: auto;
      height: auto;
      border-radius: 0;
      color: var(--muted);
      box-shadow: none;
    }
    .nav-icon {
      width: 22px;
      height: 22px;
      display: block;
      background-color: currentColor;
      -webkit-mask: center / contain no-repeat;
      mask: center / contain no-repeat;
    }
    .icon-home { -webkit-mask-image: url("assets/mobile-icons/home.png"); mask-image: url("assets/mobile-icons/home.png"); }
    .icon-calendar { -webkit-mask-image: url("assets/mobile-icons/calendar.png"); mask-image: url("assets/mobile-icons/calendar.png"); }
    .icon-add { -webkit-mask-image: url("assets/mobile-icons/add.png"); mask-image: url("assets/mobile-icons/add.png"); }
    .icon-setting { -webkit-mask-image: url("assets/mobile-icons/setting.png"); mask-image: url("assets/mobile-icons/setting.png"); }
    .nav-label { line-height: 1; }
    .dot-legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 10px;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 4px; }
    .legend-item .event-dot { flex: 0 0 auto; }
    }

    .sheet-wrap {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      align-items: end;
      background: rgba(7, 14, 9, .42);
      padding-top: 44px;
    }
    .sheet {
      width: min(100%, 560px);
      max-height: calc(100dvh - 44px);
      margin: 0 auto;
      overflow: auto;
      border-radius: 22px 22px 0 0;
      background: var(--surface-strong);
      padding: 10px 18px calc(22px + env(safe-area-inset-bottom));
      box-shadow: 0 -20px 60px rgba(0, 0, 0, .22);
    }
    .grabber { width: 38px; height: 5px; margin: 0 auto 10px; border-radius: 5px; background: var(--line); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .sheet-head h2 { margin: 0; font-size: 20px; }
    .text-button { min-height: 40px; padding: 0 8px; background: transparent; color: var(--accent); font-weight: 700; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 10px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 650; }
    label.wide { grid-column: 1 / -1; }
    input, select, textarea {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      padding: 10px 12px;
    }
    textarea { min-height: 82px; resize: vertical; }
    .form-actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 4px; }
    .delete-button { min-width: 76px; }

    .toast {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: calc(90px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      width: max-content;
      max-width: calc(100% - 36px);
      border-radius: 12px;
      background: var(--ink);
      color: var(--bg);
      padding: 10px 14px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (min-width: 700px) {
      .app { padding-left: 20px; padding-right: 20px; }
      .calendar-section { padding: 18px; }
    }
    @media (max-width: 370px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .calendar-section { padding: 11px; }
      .day { border-radius: 9px; }
      .form-grid { grid-template-columns: 1fr; }
      label.wide, .form-actions { grid-column: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .bottom-nav { background: var(--surface-strong); backdrop-filter: none; -webkit-backdrop-filter: none; }
    }

    /* 小日常 UI 视觉语言 V1.0 */
    @font-face {
      font-family: "Kouyi Script";
      src: url("assets/fonts/lobster/lobster-latin.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root {
      color-scheme: light;
      --bg: #fff5f2;
      --surface: #fffaf7;
      --surface-strong: #fffdfb;
      --ink: #3f3734;
      --muted: #847773;
      --line: #eaded9;
      --accent: #f2762e;
      --accent-script: #d95b2b;
      --accent-soft: #fff0e7;
      --reserved: #f5b14d;
      --reserved-soft: #faead6;
      --confirmed: #8fc9e9;
      --confirmed-soft: #e4f2f8;
      --completed: #8dbb91;
      --completed-soft: #e7f0e5;
      --personal: #b184c7;
      --personal-soft: #f5efff;
      --personal-ink: #704d7d;
      --cancelled: #aaa19e;
      --danger: #b64c43;
      --radius: 18px;
      --shadow: 0 14px 34px rgba(122, 75, 52, .08);
      --font-display: "Source Han Serif SC", "Noto Serif CJK SC", "思源宋体", "Songti SC", "STSong", serif;
      --font-ui: "Source Han Sans SC", "Noto Sans CJK SC", "思源黑体", "PingFang SC", system-ui, sans-serif;
      font-family: var(--font-ui);
    }

    html, body { background: var(--bg); }
    body { color: var(--ink); }
    .app {
      width: min(100%, 520px);
      padding: env(safe-area-inset-top) 18px calc(104px + env(safe-area-inset-bottom));
    }
    .topbar {
      height: auto;
      min-height: 84px;
      padding: 12px 2px 10px;
      align-items: flex-start;
    }
    .brand { position: relative; }
    .brand h1 {
      font-family: var(--font-display);
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .save-state {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }
    .home-art {
      position: relative;
      flex: 0 0 86px;
      width: 86px;
      height: 74px;
      margin-top: -5px;
    }
    .home-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .home-art .sun {
      position: absolute;
      top: 3px;
      right: 2px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f7ca64;
    }
    .home-art .sun::before {
      content: "•  •";
      position: absolute;
      inset: 8px 0 auto;
      color: #5f513d;
      font-size: 8px;
      text-align: center;
      letter-spacing: 3px;
    }
    .home-art .sun::after {
      content: "";
      position: absolute;
      left: 15px;
      top: 24px;
      width: 11px;
      height: 5px;
      border-bottom: 2px solid #5f513d;
      border-radius: 0 0 10px 10px;
    }
    .home-art .mini-calendar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 48px;
      height: 43px;
      border-radius: 13px;
      background: #fff1e9;
      box-shadow: inset 0 11px 0 #ff9875;
      transform: rotate(4deg);
    }
    .home-art .mini-calendar::before {
      content: "";
      position: absolute;
      inset: 17px 8px 8px;
      border-radius: 7px;
      background:
        radial-gradient(circle, #f2b29b 0 2px, transparent 2.5px) 0 0 / 11px 10px;
    }
    .today-btn {
      min-height: 34px;
      padding: 0;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
    }
    .view { gap: 15px; }

    .week-wheel-head { margin-top: 2px; }
    .week-wheel-title { font-size: 11px; color: var(--muted); }
    .week-wheel-actions { gap: 8px; }
    .week-shift {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: #fde8d9;
      color: var(--accent);
      font-size: 19px;
    }

    body[data-view="homeView"] .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      gap: 10px;
      padding-top: 18px;
      overflow: visible;
    }
    body[data-view="homeView"] .brand { display: contents; }
    body[data-view="homeView"] .brand h1 {
      grid-column: 1;
      grid-row: 1;
      position: relative;
      width: max-content;
      padding: 0 0 7px 1px;
      font-family: "Kouyi Script", "Snell Roundhand", "Brush Script MT", cursive;
      color: var(--accent-script);
      font-size: 48px;
      font-weight: 400;
      line-height: 1.16;
      letter-spacing: -.02em;
    }
    body[data-view="homeView"] .save-state {
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      position: relative;
      z-index: 2;
      margin: 0;
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 24px;
      font-weight: 500;

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="cloud-sync.js"></script>
  <script>
    const STORAGE_KEY = "ivy-interpreter-schedule-v1";
    const BACKUP_KEY = "ivy-interpreter-schedule-backups-v1";
    const MAX_BACKUPS = 30;
    const STATUS_LABELS = { reserved: "预定", confirmed: "确认", completed: "已完成", cancelled: "取消" };
    const $ = id => document.getElementById(id);
    let state = loadState();
    let selectedDate = todayKey();
    let viewDate = dateFromKey(selectedDate);
    let currentFilter = "all";
    let currentView = "homeView";
    let homeSelectedDate = null;
    let homePopoverPinned = false;
    let weekOffset = 0;
    let previousView = "homeView";
    let speechRecognizer = null;
    let calendarLongPressTimer = null;
    let calendarLongPressTriggered = false;
    let supabaseClient = null;
    let cloudUser = null;
    let cloudSyncStatus = "登录后点击“立即同步”检查状态。";

    function defaultState() {
      return { version: 1, records: [], settings: {}, industries: [], learnedContacts: [] };
    }
    function unwrap(input) {
      if (!input) return {};
      if (Array.isArray(input)) return { records: input };
      if (typeof input.payload === "string") {
        try { return unwrap(JSON.parse(input.payload)); } catch { return input; }
      }
      if (Array.isArray(input.backups) && input.backups[0]) return unwrap(input.backups[0]);
      return input;
    }
    function normalizeRecord(record) {
      return {
        id: record.id || makeId(),
        recordType: record.recordType || (record.isPersonal ? "blocker" : "meeting"),
        projectName: record.projectName || "",
        clientName: record.clientName || "",
        industry: record.industry || "",
        eventDate: record.eventDate || "",
        endDate: record.endDate || "",
        durationType: record.durationType || "全天",
        durationDetail: record.durationDetail || "",
        location: record.location || "",
        interpretingType: record.interpretingType || "",
        status: record.status || "reserved",
        prepPath: record.prepPath || "",
        notes: record.notes || "",
        postNotes: record.postNotes || "",
        meetingMinutes: record.meetingMinutes || "",
        knowledgeText: record.knowledgeText || "",
        hidden: Boolean(record.hidden),
        includeInCv: Boolean(record.includeInCv),
        updatedAt: record.updatedAt || new Date().toISOString()
      };
    }
    function normalizeState(input) {
      const source = unwrap(input);
      const base = defaultState();
      return {
        version: 1,
        records: (Array.isArray(source.records) ? source.records : []).map(normalizeRecord),
        settings: { ...base.settings, ...(source.settings || {}) },
        industries: Array.isArray(source.industries) ? source.industries : [],
        learnedContacts: Array.isArray(source.learnedContacts) ? source.learnedContacts : []
      };
    }
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? normalizeState(JSON.parse(saved)) : loadBackup() || defaultState();
      } catch { return loadBackup() || defaultState(); }
    }
    function persist(message = "已保存到本机") {
      const savedAt = new Date().toISOString();
      const payload = JSON.stringify({ ...state, savedAt });
      localStorage.setItem(STORAGE_KEY, payload);
      try {
        const backups = JSON.parse(localStorage.getItem(BACKUP_KEY) || "[]");
        backups.unshift({ savedAt, payload });
        localStorage.setItem(BACKUP_KEY, JSON.stringify(backups.slice(0, MAX_BACKUPS)));
      } catch {
        localStorage.setItem(BACKUP_KEY, JSON.stringify([{ savedAt, payload }]));
      }
      renderHeader();
    }
    function loadBackup() {
      try {
        const backups = JSON.parse(localStorage.getItem(BACKUP_KEY) || "[]");
        if (!backups.length) return null;
        return normalizeState(JSON.parse(backups[0].payload));
      } catch { return null; }
    }
    function storeBackupSnapshot(snapshot) {
      const savedAt = new Date().toISOString();
      const payload = JSON.stringify({ ...snapshot, savedAt });
      try {
        const backups = JSON.parse(localStorage.getItem(BACKUP_KEY) || "[]");
        backups.unshift({ savedAt, payload });
        localStorage.setItem(BACKUP_KEY, JSON.stringify(backups.slice(0, MAX_BACKUPS)));
      } catch {
        localStorage.setItem(BACKUP_KEY, JSON.stringify([{ savedAt, payload }]));
      }
    }
    function makeId() { return `rec-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`; }
    function todayKey() { return keyFromDate(new Date()); }
    function keyFromDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }
    function dateFromKey(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day);
    }
    function occursOn(record, key) {
      if (!record.eventDate) return false;
      return record.eventDate <= key && key <= (record.endDate || record.eventDate);
    }
    function visibleRecords() { return state.records.filter(record => !record.hidden && record.recordType !== "blocker"); }
    function visibleBlockers() { return state.records.filter(record => !record.hidden && record.recordType === "blocker"); }
    function compareRecords(a, b) {
      return (a.eventDate || "9999-12-31").localeCompare(b.eventDate || "9999-12-31") || (a.projectName || "").localeCompare(b.projectName || "", "zh-CN");
    }
    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }
    function formatMonth(date) { return `${date.getFullYear()}年${date.getMonth() + 1}月`; }
    function formatSelectedDate(key) {
      const date = dateFromKey(key);
      const today = key === todayKey() ? "今天，" : "";
      const weekday = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][date.getDay()];
      return `${today}${date.getMonth() + 1}月${date.getDate()}日 ${weekday}`;
    }
    function formatHomeDate() {
      const date = new Date();
      const weekday = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][date.getDay()];
      return `${date.getMonth() + 1}月${date.getDate()}日 ${weekday}`;
    }
    function renderHeader() {
      const content = {
        homeView: ["Today", formatHomeDate()],
        calendarView: ["月历视图", formatMonth(viewDate)],
        addView: ["", ""],
        settingsView: ["", ""]
      }[currentView] || ["Today", formatHomeDate()];
      $("pageTitle").textContent = content[0];
      $("pageSubtitle").textContent = content[1];
      document.body.dataset.view = currentView;
      $("homeArt").classList.toggle("hidden", currentView !== "homeView");
      document.querySelector(".topbar").classList.toggle("hidden", ["addView", "settingsView"].includes(currentView));
      $("todayBtn").classList.toggle("hidden", currentView !== "calendarView");
    }
    function formatRange(record) {
      if (!record.eventDate) return "日期待定";
      if (!record.endDate || record.endDate === record.eventDate) return record.eventDate.slice(5).replace("-", "月") + "日";
      return `${record.eventDate.slice(5)} 至 ${record.endDate.slice(5)}`;
    }
    function renderCalendar() {
      $("monthTitle").textContent = formatMonth(viewDate);
      const weekdays = ["一", "二", "三", "四", "五", "六", "日"];
      const first = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
      const offset = (first.getDay() + 6) % 7;
      const start = new Date(first);
      start.setDate(first.getDate() - offset);
      const pieces = weekdays.map(day => `<div class="weekday">${day}</div>`);
      const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
      const totalCells = offset + daysInMonth <= 35 ? 35 : 42;
      for (let i = 0; i < totalCells; i += 1) {
        const date = new Date(start);
        date.setDate(start.getDate() + i);
        const key = keyFromDate(date);
        const records = visibleRecords().filter(record => record.status !== "cancelled" && occursOn(record, key));
        const blockers = visibleBlockers().filter(record => occursOn(record, key));
        const classes = ["day"];
        const statuses = new Set(records.map(record => record.status));
        if (statuses.has("confirmed")) classes.push("has-confirmed");
        else if (statuses.has("reserved")) classes.push("has-reserved");
        else if (statuses.has("completed")) classes.push("has-completed");
        if (blockers.length) classes.push("has-blocker");
        if (blockers.length && !records.length) classes.push("blocker-only");
        if (date.getMonth() !== viewDate.getMonth()) classes.push("outside");
        if (key === todayKey()) classes.push("today");
        if (key === selectedDate) classes.push("selected");
        const description = [records.length ? `${records.length}场会议` : "", blockers.length ? `${blockers.length}项占用` : ""].filter(Boolean).join("，");
        pieces.push(`<button class="${classes.join(" ")}" type="button" data-date="${key}" aria-label="${key}${description ? `，${description}` : ""}"><span class="day-number">${date.getDate()}</span></button>`);
      }
      $("calendar").innerHTML = pieces.join("");
    }
    function meetingCard(record, showDate = false) {
      const meta = [record.interpretingType, record.location, record.durationDetail || record.durationType].filter(Boolean);
      const fullDate = record.eventDate ? record.eventDate.replaceAll("-", "年").replace(/年(\d{2})年/, "年$1月") + "日" : "日期待定";
      return `<button class="meeting status-${escapeHtml(record.status)}" type="button" data-edit="${escapeHtml(record.id)}">
        <span class="meeting-top">
          ${showDate ? `<span class="meeting-date">${escapeHtml(fullDate)}</span>` : `<span class="meeting-date">当日日程</span>`}
          <span class="meeting-meta">${escapeHtml(meta.join(" · ") || "详细信息待补充")}</span>
        </span>
        <span class="meeting-title">${escapeHtml(record.projectName || "未命名日程")}</span>
      </button>`;
    }
    function blockerCard(record) {
      const startDate = record.eventDate ? dateFromKey(record.eventDate) : null;
      const endDate = record.endDate ? dateFromKey(record.endDate) : null;
      const start = startDate ? `${startDate.getFullYear()}年${startDate.getMonth() + 1}月${startDate.getDate()}日` : "日期待定";
      const end = endDate && record.endDate !== record.eventDate ? `至 ${endDate.getMonth() + 1}月${endDate.getDate()}日` : "全天占用";
      return `<button class="meeting blocker-item" type="button" data-edit-blocker="${escapeHtml(record.id)}">
        <span class="meeting-top">
          <span class="meeting-date">${escapeHtml(start)}</span>
          <span class="meeting-meta">${escapeHtml(end)}</span>
        </span>
        <span class="meeting-title">${escapeHtml(record.projectName || "占用")}</span>
      </button>`;
    }
    function emptyState(title, body) {
      return `<div class="empty"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(body)}</span></div>`;
    }
    function renderWeekStrip() {
      const weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
      const start = new Date();
      const mondayOffset = (start.getDay() + 6) % 7;
      start.setDate(start.getDate() - mondayOffset + weekOffset * 7);
      const pieces = [];
      for (let i = 0; i < 7; i += 1) {
        const date = new Date(start);
        date.setDate(start.getDate() + i);
        const key = keyFromDate(date);
        const records = visibleRecords().filter(record => record.status !== "cancelled" && occursOn(record, key));
        const blockers = visibleBlockers().filter(record => occursOn(record, key));
        const dots = [...new Set(records.map(record => record.status))].slice(0, 3)
          .map(status => `<span class="event-dot ${escapeHtml(status)}"></span>`).join("");
        const blockerMark = blockers.length ? `<span class="blocker-mark" aria-hidden="true"></span>` : "";
        const description = [records.length ? `${records.length}场会议` : "", blockers.length ? `${blockers.length}项占用` : ""].filter(Boolean).join("，") || "空闲";
        pieces.push(`<button class="week-day ${key === todayKey() ? "today" : ""} ${key === homeSelectedDate ? "selected" : ""}" type="button" data-week-date="${key}" aria-label="${key}，${description}">
          <span class="week-name">${key === todayKey() ? "今天" : weekdays[date.getDay()].slice(1)}</span>
          <span class="week-number">${date.getDate()}</span>
          <span class="dot-row">${dots}${blockerMark}</span>
        </button>`);
      }
      $("weekStrip").innerHTML = pieces.join("");
    }
    function renderSelectedDay() {
      const panel = $("selectedDayPanel");
      if (!homeSelectedDate) {
        panel.classList.add("hidden");
        return;
      }
      const records = visibleRecords().filter(record => record.status !== "cancelled" && occursOn(record, homeSelectedDate)).sort(compareRecords);
      const blockers = visibleBlockers().filter(record => occursOn(record, homeSelectedDate)).sort(compareRecords);
      if (!records.length && !blockers.length) {
        panel.classList.add("hidden");
        return;
      }
      $("selectedDayTitle").textContent = formatSelectedDate(homeSelectedDate).replace("今天，", "");
      $("selectedDayCount").textContent = [records.length ? `${records.length} 场日程` : "", blockers.length ? `${blockers.length} 项占用` : ""].filter(Boolean).join("，");
      $("selectedDayList").innerHTML = [...blockers.map(blockerCard), ...records.map(record => meetingCard(record))].join("");
      const strip = $("weekStrip");
      panel.style.top = `${strip.offsetTop + strip.offsetHeight + 7}px`;
      panel.classList.remove("hidden");
    }
    function renderUpcoming() {
      const today = todayKey();
      const upcoming = visibleRecords()
        .filter(record => (record.endDate || record.eventDate) >= today && ["reserved", "confirmed"].includes(record.status))
        .sort(compareRecords)
        .slice(0, 5);
      const pieces = upcoming.map(record => {
        const date = dateFromKey(record.eventDate);
        return `<button class="paper-note status-${escapeHtml(record.status)}" type="button" data-edit="${escapeHtml(record.id)}">
          <span class="note-date"><strong>${date.getDate()}</strong>${date.getMonth() + 1}月</span>
          <span class="note-main"><span class="note-title">${escapeHtml(record.projectName || "未命名日程")}</span></span>
        </button>`;
      });
      $("upcomingList").innerHTML = pieces.join("");
    }
    function renderAllList() {
      let records = visibleRecords();
      if (currentFilter !== "all") records = records.filter(record => record.status === currentFilter);
      records = currentFilter === "completed" ? records.sort((a, b) => compareRecords(b, a)) : records.sort(compareRecords);
      const blockers = currentFilter === "all" ? visibleBlockers().sort(compareRecords) : [];
      const entries = [
        ...records.map(record => ({ record, html: meetingCard(record, true) })),
        ...blockers.map(record => ({ record, html: blockerCard(record) }))
      ].sort((a, b) => compareRecords(a.record, b.record));
      $("allCount").textContent = `${entries.length} 条`;
      $("allList").innerHTML = entries.length ? entries.map(entry => entry.html).join("") : emptyState("这里还没有记录", "新增日程或标记占用后会显示在这里");
      $("localSummary").textContent = `当前有 ${visibleRecords().length} 条日程。每次修改都会立即保存，并保留最近 30 份本机备份。`;
    }
    function render() { renderHeader(); renderWeekStrip(); renderSelectedDay(); renderUpcoming(); renderCalendar(); renderAllList(); }

    function rangesOverlap(startA, endA, startB, endB) {
      return Boolean(startA && startB && startA <= (endB || startB) && startB <= (endA || startA));
    }
    function openBlocker(dateKey = selectedDate, record = null) {
      const existing = record || visibleBlockers().find(item => occursOn(item, dateKey));
      $("blockerForm").reset();
      $("blockerId").value = existing?.id || "";
      $("blockerTitleInput").value = existing?.projectName || "";
      $("blockerDate").value = existing?.eventDate || dateKey || todayKey();
      $("blockerEndDate").value = existing?.endDate || existing?.eventDate || dateKey || todayKey();
      $("blockerNotes").value = existing?.notes === "日程占用标记" ? "" : (existing?.notes || "");
      $("blockerTitleHeading").textContent = existing ? "编辑占用" : "标记占用";
      $("deleteBlockerBtn").classList.toggle("hidden", !existing);
      $("blockerOverlay").classList.remove("hidden");
      setTimeout(() => $("blockerTitleInput").focus(), 0);
    }
    function closeBlocker() {
      $("blockerOverlay").classList.add("hidden");
    }
    function saveBlocker(event) {
      event.preventDefault();
      if (!$("blockerForm").reportValidity()) return;
      let startDate = $("blockerDate").value;
      let endDate = $("blockerEndDate").value || startDate;
      if (endDate < startDate) [startDate, endDate] = [endDate, startDate];
      const id = $("blockerId").value;
      const existing = state.records.find(record => record.id === id && record.recordType === "blocker");
      const record = normalizeRecord({
        ...(existing || {}),
        id: id || makeId(),
        recordType: "blocker",
        projectName: $("blockerTitleInput").value.trim(),
        eventDate: startDate,
        endDate,
        status: "reserved",
        durationType: "全天",
        notes: $("blockerNotes").value.trim() || "日程占用标记",
        updatedAt: new Date().toISOString()
      });
      if (id) state.records = state.records.map(item => item.id === id ? record : item);
      else state.records.push(record);
      selectedDate = startDate;
      viewDate = dateFromKey(startDate);
      persist();
      render();
      closeBlocker();
      showToast(id ? "占用已更新" : "占用已保存");
    }
    function deleteBlocker() {
      const id = $("blockerId").value;
      if (!id || !window.confirm("确定取消这项占用吗？")) return;
      state.records = state.records.filter(record => record.id !== id);
      persist();
      render();
      closeBlocker();
      showToast("占用已取消");
    }

    function openSheet(record = null) {
      previousView = currentView === "addView" ? "homeView" : currentView;
      $("recordForm").reset();
      $("recordId").value = record?.id || "";
      $("projectName").value = record?.projectName || "";
      $("eventDate").value = record?.eventDate || selectedDate;
      $("endDate").value = record?.endDate || record?.eventDate || selectedDate;
      $("status").value = record?.status || "reserved";
      $("durationType").value = record?.durationType || "全天";
      $("interpretingType").value = record?.interpretingType || "";
      $("durationDetail").value = record?.durationDetail || "";
      $("location").value = record?.location || "";
      $("clientName").value = record?.clientName || "";
      $("industry").value = record?.industry || "";
      $("notes").value = record?.notes || "";
      $("quickInput").value = "";
      $("recognitionState").textContent = record ? "正在编辑" : "等待识别";
      $("sheetTitle").textContent = record ? "编辑日程" : "新增日程";
      $("deleteBtn").classList.toggle("hidden", !record);
      switchView("addView");
    }
    function closeSheet() {
      switchView(previousView || "homeView");
    }
    function saveRecord(event) {
      event?.preventDefault();
      if (!$("recordForm").reportValidity()) return;
      const id = $("recordId").value;
      const existing = state.records.find(record => record.id === id);
      const record = normalizeRecord({
        ...(existing || {}),
        id: id || makeId(),
        projectName: $("projectName").value.trim(),
        eventDate: $("eventDate").value,
        endDate: $("endDate").value || $("eventDate").value,
        status: $("status").value,
        durationType: $("durationType").value,
        interpretingType: $("interpretingType").value,
        durationDetail: $("durationDetail").value.trim(),
        location: $("location").value.trim(),
        clientName: $("clientName").value.trim(),
        industry: $("industry").value.trim(),
        notes: $("notes").value.trim(),
        updatedAt: new Date().toISOString()
      });
      const blockerConflict = visibleBlockers().find(blocker => rangesOverlap(record.eventDate, record.endDate, blocker.eventDate, blocker.endDate));
      if (blockerConflict && !window.confirm(`这段时间已标记为“${blockerConflict.projectName || "占用"}”，仍要保存会议吗？`)) return;
      if (id) state.records = state.records.map(item => item.id === id ? record : item);
      else state.records.push(record);
      selectedDate = record.eventDate;
      viewDate = dateFromKey(selectedDate);
      persist();
      render();
      closeSheet();
      showToast(id ? "日程已更新" : "日程已保存");
    }
    function deleteRecord() {
      const id = $("recordId").value;
      if (!id || !window.confirm("确定删除这条日程吗？")) return;
      state.records = state.records.filter(record => record.id !== id);
      persist();
      render();
      closeSheet();
      showToast("日程已删除");
    }
    function exportData() {
      const payload = JSON.stringify({ ...state, savedAt: new Date().toISOString() }, null, 2);
      const blob = new Blob([payload], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `ivy-schedule-${todayKey()}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("数据文件已导出");
    }
    function importData(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = normalizeState(JSON.parse(reader.result));
          if (!window.confirm(`将导入 ${imported.records.length} 条记录并替换本机数据，是否继续？`)) return;
          state = imported;
          persist("导入后已保存");
          render();
          showToast("数据导入成功");
        } catch { showToast("无法读取这个数据文件"); }
        $("importFile").value = "";
      };
      reader.readAsText(file, "utf-8");
    }
    function restoreBackup() {
      const restored = loadBackup();
      if (!restored) return showToast("没有找到本机备份");
      if (!window.confirm(`将恢复最近备份中的 ${restored.records.length} 条记录，是否继续？`)) return;
      state = restored;
      persist("恢复后已保存");
      render();
      showToast("已恢复最近备份");
    }
    function renderCloudAuth() {
      const signedIn = Boolean(cloudUser);
      $("cloudLoginFields").classList.toggle("hidden", signedIn);
      $("cloudSignedInActions").classList.toggle("hidden", !signedIn);
      $("cloudAuthStatus").textContent = signedIn
        ? `已连接：${cloudUser.email || "个人账号"}。${cloudSyncStatus}`
        : "尚未登录。登录后可以使用安全的双向同步。";
    }
    async function initCloudAuth() {
      const config = window.XIAORICHANG_SUPABASE;
      if (!window.supabase?.createClient || !config?.url || !config?.publishableKey) {
        $("cloudAuthStatus").textContent = "云端连接组件未能加载，请确认网络连接后刷新。";
        return;
      }
      supabaseClient = window.supabase.createClient(config.url, config.publishableKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
      });
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        $("cloudAuthStatus").textContent = `连接检查失败：${error.message}`;
        return;
      }
      cloudUser = data.session?.user || null;
      renderCloudAuth();
      supabaseClient.auth.onAuthStateChange((_event, session) => {
        cloudUser = session?.user || null;
        renderCloudAuth();
      });
    }
    async function signInCloud() {
      if (!supabaseClient) return showToast("云端连接尚未准备好，请刷新后重试");
      const email = $("cloudEmail").value.trim();
      const password = $("cloudPassword").value;
      if (!email || !password) return showToast("请填写登录邮箱和密码");
      const button = $("cloudLoginBtn");
      button.disabled = true;
      button.textContent = "正在登录……";
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      button.disabled = false;
      button.textContent = "登录云端";
      $("cloudPassword").value = "";
      if (error) return showToast(`登录失败：${error.message}`);
      cloudUser = data.user;
      renderCloudAuth();
      showToast("云端账号登录成功");
    }

    function formatCloudSyncTime(value) {
      if (!value) return "刚刚";
      return new Date(value).toLocaleString("zh-CN", { hour12: false });
    }

    async function runCloudSync() {
      if (!supabaseClient || !cloudUser) return showToast("请先登录云端账号");
      if (!window.XiaorichangCloudSync?.sync) return showToast("同步组件尚未准备好，请刷新后重试");
      const button = $("syncNowBtn");
      button.disabled = true;
      button.textContent = "正在同步……";
      cloudSyncStatus = "正在比较本机与云端数据……";
      renderCloudAuth();
      try {
        const result = await window.XiaorichangCloudSync.sync({
          client: supabaseClient,
          userId: cloudUser.id,
          scope: "mobile",
          localState: state,
          normalizeRemote: normalizeState,
          backupLocal: storeBackupSnapshot,
          replaceLocal: remoteState => {
            state = normalizeState(window.XiaorichangCloudSync.mergeSharedState(state, remoteState));
            persist("云端数据已保存到本机");
            selectedDate = todayKey();
            viewDate = dateFromKey(selectedDate);
            render();
          }
        });
        const count = state.records.length;
        if (result.status === "uploaded") cloudSyncStatus = `已上传 ${count} 条记录 · ${formatCloudSyncTime(result.updatedAt)}`;
        else if (result.status === "downloaded") cloudSyncStatus = `已下载 ${count} 条记录 · ${formatCloudSyncTime(result.updatedAt)}`;
        else if (result.status === "current") cloudSyncStatus = `已是最新状态 · ${formatCloudSyncTime(result.updatedAt)}`;
        else cloudSyncStatus = "检测到本机和云端都有修改，已暂停同步，未覆盖任何数据。";
        renderCloudAuth();
        showToast(result.status === "conflict" ? "发现同步冲突，未覆盖任何数据" : cloudSyncStatus);
      } catch (error) {
        cloudSyncStatus = `同步失败：${error.message || "未知错误"}`;
        renderCloudAuth();
        showToast(cloudSyncStatus);
      } finally {
        button.disabled = false;
        button.textContent = "立即同步";
      }
    }
    async function signOutCloud() {
      if (!supabaseClient) return;
      const { error } = await supabaseClient.auth.signOut();
      if (error) return showToast(`退出失败：${error.message}`);
      cloudUser = null;
      cloudSyncStatus = "登录后点击“立即同步”检查状态。";
      renderCloudAuth();
      showToast("已退出云端账号");
    }
    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2100);
    }
    function switchView(viewId) {
      currentView = viewId;
      document.querySelectorAll(".view").forEach(view => view.classList.toggle("hidden", view.id !== viewId));
      document.querySelectorAll(".nav-button, .nav-add").forEach(button => button.classList.toggle("active", button.dataset.view === viewId));
      document.querySelector(".bottom-nav").classList.remove("hidden-for-form");
      renderHeader();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function parseQuickEntry() {
      const raw = $("quickInput").value.trim();
      if (!raw) return showToast("请先输入或说出邀约信息");
      const dateMatch = raw.match(/(?:(20\d{2})[年/-])?(\d{1,2})[月/-](\d{1,2})日?/);
      if (dateMatch) {
        const year = Number(dateMatch[1] || new Date().getFullYear());
        $("eventDate").value = `${year}-${String(dateMatch[2]).padStart(2, "0")}-${String(dateMatch[3]).padStart(2, "0")}`;
        $("endDate").value = $("eventDate").value;
      }
      if (/\bSI\b|同传|同声传译/i.test(raw)) $("interpretingType").value = "SI";
      if (/\bCI\b|交传|交替传译/i.test(raw)) $("interpretingType").value = "CI";
      if (/确认|已定|确定/.test(raw)) $("status").value = "confirmed";
      else if (/完成/.test(raw)) $("status").value = "completed";
      else $("status").value = "reserved";
      if (/半天/.test(raw)) $("durationType").value = "半天";
      else if (/全天|全日/.test(raw)) $("durationType").value = "全天";
      const locations = ["北京", "上海", "广州", "深圳", "大连", "杭州", "成都", "线上", "Zoom", "腾讯会议"];
      $("location").value = locations.find(item => raw.toLowerCase().includes(item.toLowerCase())) || $("location").value;
      const cleaned = raw
        .replace(dateMatch?.[0] || "", "")
        .replace(/\b(?:SI|CI)\b|同传|同声传译|交传|交替传译|全天|全日|半天|已确认|确认|已定|确定|预定/gi, "")
        .replace($("location").value || "\u0000", "")
        .replace(/线上/g, "")
        .replace(/[，,。；;]+/g, " ")
        .trim();
      if (cleaned) $("projectName").value = cleaned;
      $("notes").value = `快速录入原文：${raw}`;
      $("recognitionState").textContent = "已识别，请检查";
      showToast("信息已整理到表单");
    }

    function toggleVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return showToast("当前浏览器暂不支持语音识别");
      if (speechRecognizer) {
        speechRecognizer.stop();
        return;
      }
      speechRecognizer = new SpeechRecognition();
      speechRecognizer.lang = "zh-CN";
      speechRecognizer.interimResults = true;
      speechRecognizer.onresult = event => {
        $("quickInput").value = Array.from(event.results).map(result => result[0].transcript).join("");
      };
      speechRecognizer.onend = () => {
        speechRecognizer = null;
        $("voiceInputBtn").textContent = "语音输入";
      };
      speechRecognizer.onerror = () => showToast("语音输入没有成功，请再试一次");
      speechRecognizer.start();
      $("voiceInputBtn").textContent = "正在聆听";
    }

    $("calendar").addEventListener("click", event => {
      const day = event.target.closest("[data-date]");
      if (!day) return;
      if (calendarLongPressTriggered) {
        calendarLongPressTriggered = false;
        return;
      }
      selectedDate = day.dataset.date;
      viewDate = dateFromKey(selectedDate);
      renderCalendar();
    });
    $("calendar").addEventListener("pointerdown", event => {
      const day = event.target.closest("[data-date]");
      if (!day) return;
      clearTimeout(calendarLongPressTimer);
      calendarLongPressTriggered = false;
      calendarLongPressTimer = setTimeout(() => {
        calendarLongPressTriggered = true;
        selectedDate = day.dataset.date;
        viewDate = dateFromKey(selectedDate);
        renderCalendar();
        openBlocker(selectedDate);
      }, 560);
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(type => {
      $("calendar").addEventListener(type, () => clearTimeout(calendarLongPressTimer));
    });
    $("calendar").addEventListener("contextmenu", event => {
      if (event.target.closest("[data-date]")) event.preventDefault();
    });
    $("weekStrip").addEventListener("mouseover", event => {
      const day = event.target.closest("[data-week-date]");
      if (!day || day === event.relatedTarget?.closest?.("[data-week-date]")) return;
      if (day.getAttribute("aria-label")?.includes("空闲")) {
        if (!homePopoverPinned) {
          homeSelectedDate = null;
          $("weekStrip").querySelectorAll(".week-day").forEach(item => item.classList.remove("selected"));
          renderSelectedDay();
        }
        return;
      }
      homeSelectedDate = day.dataset.weekDate;
      $("weekStrip").querySelectorAll(".week-day").forEach(item => item.classList.toggle("selected", item === day));
      renderSelectedDay();
    });
    $("weekStrip").addEventListener("focusin", event => {
      const day = event.target.closest("[data-week-date]");
      if (!day || day.getAttribute("aria-label")?.includes("空闲")) return;
      homeSelectedDate = day.dataset.weekDate;
      $("weekStrip").querySelectorAll(".week-day").forEach(item => item.classList.toggle("selected", item === day));
      renderSelectedDay();
    });
    $("weekStrip").addEventListener("mouseleave", () => {
      if (homePopoverPinned) return;
      homeSelectedDate = null;
      $("weekStrip").querySelectorAll(".week-day").forEach(item => item.classList.remove("selected"));
      renderSelectedDay();
    });
    $("weekStrip").addEventListener("click", event => {
      const day = event.target.closest("[data-week-date]");
      if (!day) return;
      const closePinned = homePopoverPinned && homeSelectedDate === day.dataset.weekDate;
      homePopoverPinned = !closePinned;
      homeSelectedDate = closePinned ? null : day.dataset.weekDate;
      $("weekStrip").querySelectorAll(".week-day").forEach(item => item.classList.toggle("selected", !closePinned && item === day));
      renderSelectedDay();
    });
    $("weekPrevBtn").addEventListener("click", () => {
      weekOffset -= 1;
      homePopoverPinned = false;
      homeSelectedDate = null;
      renderWeekStrip();
      renderSelectedDay();
    });
    $("weekNextBtn").addEventListener("click", () => {
      weekOffset += 1;
      homePopoverPinned = false;
      homeSelectedDate = null;
      renderWeekStrip();
      renderSelectedDay();
    });
    document.addEventListener("click", event => {
      if (currentView === "homeView" && !event.target.closest("#weekStrip, #selectedDayPanel")) {
        homePopoverPinned = false;
        homeSelectedDate = null;
        $("weekStrip").querySelectorAll(".week-day").forEach(item => item.classList.remove("selected"));
        renderSelectedDay();
      }
      const edit = event.target.closest("[data-edit]");
      if (edit) openSheet(state.records.find(record => record.id === edit.dataset.edit));
      const editBlocker = event.target.closest("[data-edit-blocker]");
      if (editBlocker) openBlocker(selectedDate, state.records.find(record => record.id === editBlocker.dataset.editBlocker));
    });
    $("prevMonthBtn").addEventListener("click", () => { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1); renderCalendar(); });
    $("nextMonthBtn").addEventListener("click", () => { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1); renderCalendar(); });
    $("todayBtn").addEventListener("click", () => { selectedDate = todayKey(); viewDate = dateFromKey(selectedDate); render(); });
    $("addBlockerBtn").addEventListener("click", () => openBlocker(selectedDate));
    $("closeBlockerBtn").addEventListener("click", closeBlocker);
    $("blockerForm").addEventListener("submit", saveBlocker);
    $("deleteBlockerBtn").addEventListener("click", deleteBlocker);
    $("blockerOverlay").addEventListener("click", event => { if (event.target === $("blockerOverlay")) closeBlocker(); });
    $("addBtn").addEventListener("click", () => openSheet());
    $("closeSheetBtn").addEventListener("click", closeSheet);
    $("parseQuickBtn").addEventListener("click", parseQuickEntry);
    $("voiceInputBtn").addEventListener("click", toggleVoiceInput);
    $("recordForm").addEventListener("submit", saveRecord);
    $("deleteBtn").addEventListener("click", deleteRecord);
    document.querySelectorAll(".nav-button").forEach(button => button.addEventListener("click", () => switchView(button.dataset.view)));
    $("filterBar").addEventListener("click", event => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;
      currentFilter = button.dataset.filter;
      document.querySelectorAll(".filter-button").forEach(item => item.classList.toggle("active", item === button));
      renderAllList();
    });
    $("exportBtn").addEventListener("click", exportData);
    $("importBtn").addEventListener("click", () => $("importFile").click());
    $("importFile").addEventListener("change", event => importData(event.target.files[0]));
    $("restoreBtn").addEventListener("click", restoreBackup);
    $("cloudLoginBtn").addEventListener("click", signInCloud);
    $("syncNowBtn").addEventListener("click", runCloudSync);
    $("cloudLogoutBtn").addEventListener("click", signOutCloud);
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      if (!$("blockerOverlay").classList.contains("hidden")) closeBlocker();
      else if (currentView === "addView") closeSheet();
    });

    render();
    initCloudAuth();
  </script>
</body>
</html>
